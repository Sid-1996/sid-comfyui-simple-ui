name: 功能建議
description: 提議新功能或改進
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: why
    attributes:
      label: 為什麼需要
      description: 使用情境與痛點
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 建議怎麼做
  - type: checkboxes
    id: pr
    attributes:
      label: 貢獻意願
      options:
        - label: 我願意送 PR（ maintainer 仍可能拒絕 ）
