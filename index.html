<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>簡易生圖</title>
<link rel="icon" href="/assets/mascot-idle.webp">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<div class="app">

  <!-- ── 頂列 ─────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <img class="brand-avatar" src="/assets/mascot-idle.webp" alt="">
      <div class="brand-text">
        <h1>簡易生圖</h1>
        <p>點標籤 · 按生成</p>
      </div>
    </div>

    <div class="topbar-spacer"></div>

    <button id="statusPill" class="status-pill" type="button" title="ComfyUI 連線狀態">
      <span class="dot"></span><span id="statusText">檢查 ComfyUI…</span>
    </button>
    <button id="btnHelp" class="btn btn-ghost btn-icon" type="button" aria-label="使用說明" title="使用說明 (?)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.3"/><circle cx="12" cy="17" r="1"/></svg>
    </button>
  </header>

  <!-- ── 三欄工作區 ───────────────────────────────────── -->
  <main class="workspace">

    <!-- 左：標籤庫 -->
    <section class="panel library" aria-label="標籤庫">
      <div class="lib-top">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
          <input id="search" type="search" placeholder="搜尋標籤，中文或英文都行" autocomplete="off" aria-label="搜尋標籤">
        </div>
        <button id="btnEn" class="mini-toggle" type="button" aria-pressed="false" title="標籤同時顯示英文">EN</button>
      </div>

      <div id="cats" class="cats" role="tablist" aria-label="標籤分類"></div>

      <div id="tags" class="tags" role="group" aria-label="標籤"></div>

      <div class="lib-foot">
        <textarea id="pos" rows="1" placeholder="補充描述（選填）：可以直接打中文，例如「櫻花 夜晚」" aria-label="補充描述"></textarea>
        <div id="warn" class="warn" role="status"></div>
        <textarea id="neg" rows="1" placeholder="負面提示詞（選填）：不想出現的東西，例如 blurry, watermark" aria-label="負面提示詞"></textarea>
        <div id="negWarn" class="warn" role="status"></div>
        <div class="lib-foot-row" style="margin-top:6px">
          <button id="btnNegClear" class="btn btn-ghost btn-sm" type="button">清除負面</button>
          <button id="btnNegDefault" class="btn btn-ghost btn-sm" type="button">預設負面</button>
          <button id="btnNegCopy" class="btn btn-ghost btn-sm" type="button">複製負面</button>
        </div>
        <div class="lib-foot-row">
          <button id="btnRandom" class="btn btn-ghost btn-sm" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/></svg>
            隨機配一組
          </button>
          <button id="btnOpenFolder" class="btn btn-ghost btn-sm" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
            圖片資料夾
          </button>
        </div>
      </div>
    </section>

    <!-- 中：舞台 -->
    <section class="panel stage" aria-label="圖片舞台">
      <div class="stage-body">

        <div id="stageEmpty" class="stage-empty">
          <img class="empty-art" src="/assets/stage-empty.webp" alt="" onerror="this.style.visibility='hidden'">
          <h2>先點左邊的標籤</h2>
          <p>像點菜一樣，點 3～6 個就會有畫面了。<br>不知道要點什麼就按下面的按鈕。</p>
          <div class="empty-actions">
            <button id="btnEmptyRandom" class="btn btn-ghost" type="button">隨機配一組</button>
            <button id="btnEmptyCombo" class="btn btn-soft" type="button">用「校園少女」試試</button>
          </div>
        </div>

        <div id="stageProgress" class="stage-progress" hidden>
          <img class="prog-art" src="/assets/stage-loading.webp" alt="" onerror="this.style.visibility='hidden'">
          <div class="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
              <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="ring-label"><b id="progPct">0%</b><span id="progStep">準備中</span></div>
          </div>
          <p class="prog-text" id="progText">正在畫，先別走開…</p>
          <p class="prog-sub" id="progSub">已用 0 秒</p>
          <button id="btnCancel" class="btn btn-ghost" type="button">取消（Esc）</button>
        </div>

        <div id="stageResults" class="results" hidden></div>
      </div>

      <div class="history" id="history" hidden>
        <span class="history-label">最近</span>
        <div id="histBar" class="history-strip"></div>
      </div>
    </section>

    <!-- 右：輸出設定 -->
    <aside class="panel settings" aria-label="輸出設定">
      <div class="set-head">
        <h2>輸出設定</h2>
        <span class="meta" id="setHint">1024 × 1024</span>
      </div>

      <div class="set-body">
        <div class="field">
          <div class="field-label">尺寸</div>
          <div id="sizes" class="seg seg-size" role="group" aria-label="尺寸">
            <button type="button" data-size="1024x1024" class="on"><i class="ratio r-sq"></i><span>方形</span><small>1024²</small></button>
            <button type="button" data-size="832x1216"><i class="ratio r-tall"></i><span>直式</span><small>832×1216</small></button>
            <button type="button" data-size="1216x832"><i class="ratio r-wide"></i><span>橫式</span><small>1216×832</small></button>
          </div>
        </div>

        <div class="field">
          <div class="field-label">張數</div>
          <div id="counts" class="seg seg-count" role="group" aria-label="張數">
            <button type="button" data-n="1" class="on">1</button>
            <button type="button" data-n="2">2</button>
            <button type="button" data-n="4">4</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="ckpt">模型</label>
          <select id="ckpt"></select>
        </div>

        <label class="switch-row">
          <input type="checkbox" id="q" checked>
          <span class="switch-ui" aria-hidden="true"></span>
          <span class="switch-text">自動加品質標籤<small>masterpiece, best quality…</small></span>
        </label>

        <button id="btnAdv" class="adv-open" type="button">
          <span>進階設定</span>
          <span class="adv-sum" id="advSummary">步數 25 · CFG 6 · 種子 -1</span>
        </button>
      </div>

      <div class="set-foot">
        <span class="meta">圖片存到 D:\ComfyUI_output</span>
        <button id="btnOpenFolder2" class="btn btn-ghost btn-sm" type="button">開啟</button>
      </div>
    </aside>
  </main>

  <!-- ── 底列：已選標籤 + 生成 ─────────────────────────── -->
  <footer class="actionbar">
    <div class="selwrap">
      <span id="selCount" class="sel-count">還沒選標籤</span>
      <div id="selBar" class="sel-bar"></div>
    </div>
    <button id="btnPreview" class="btn btn-ghost" type="button">完整提示詞</button>
    <button id="btnClear" class="btn btn-ghost" type="button">清除</button>
    <button id="go" class="btn btn-primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span id="goText">生成</span>
    </button>
  </footer>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<!-- ── 大圖 ──────────────────────────────────────────── -->
<div id="lightbox" class="lightbox" hidden>
  <div class="lb-top">
    <span id="lbCount" class="lb-count"></span>
    <span id="lbMeta" class="meta"></span>
    <div class="lb-actions">
      <button id="lbDownload" class="btn btn-ghost btn-sm" type="button">下載</button>
      <button id="lbSeed" class="btn btn-ghost btn-sm" type="button">用同種子</button>
      <button id="lbPrompt" class="btn btn-ghost btn-sm" type="button">用同提示詞</button>
      <button id="lbDel" class="btn btn-ghost btn-sm danger" type="button">刪除</button>
      <button id="lbClose" class="btn btn-ghost btn-icon" type="button" aria-label="關閉">✕</button>
    </div>
  </div>
  <button id="lbPrev" class="lb-nav lb-prev" type="button" aria-label="上一張">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" class="lb-nav lb-next" type="button" aria-label="下一張">›</button>
</div>

<!-- ── 進階設定（彈出，避免右欄被擠爆） ──────────────── -->
<div id="advModal" class="modal" hidden>
  <div class="modal-card modal-card-sm" role="dialog" aria-modal="true" aria-labelledby="advTitle">
    <div class="modal-head">
      <h2 id="advTitle">進階設定</h2>
      <button id="advClose" class="btn btn-ghost btn-icon" type="button" aria-label="關閉">✕</button>
    </div>
    <div class="modal-body">
      <p class="meta">負面提示詞已移到左側設定欄，可隨時編輯。</p>

      <div class="grid2">
        <div><label class="field-label" for="steps">步數</label><input id="steps" type="number" min="8" max="60" value="25"></div>
        <div><label class="field-label" for="cfg">CFG</label><input id="cfg" type="number" min="1" max="12" step="0.5" value="6"></div>
      </div>

      <label class="field-label" for="seed">種子（-1 = 每次隨機）</label>
      <div class="seed-row">
        <input id="seed" type="number" value="-1" step="1">
        <button id="btnDice" class="btn btn-ghost btn-icon" type="button" aria-label="換一個種子" title="換一個種子">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/></svg>
        </button>
      </div>

      <p class="meta" style="margin-top:12px">改這些通常是為了一次次微調同一張圖。平常生成不用動。</p>
      <div class="modal-foot">
        <button id="advDone" class="btn btn-soft" type="button">完成</button>
      </div>
    </div>
  </div>
</div>

<!-- ── 說明 / 提示詞視窗 ─────────────────────────────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button id="modalClose" class="btn btn-ghost btn-icon" type="button" aria-label="關閉">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="/dict.js"></script>
<script src="/tags.js"></script>
<script src="/app.js"></script>
</body>
</html>
